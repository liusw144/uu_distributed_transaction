server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: seata-${DEMO_ROLE:order}
demo:
  datasource:
    mode: at
  role: ${DEMO_ROLE:order}
  stock-url: ${AT_STOCK_URL:http://127.0.0.1:8084/internal/stock}
  account-url: ${AT_ACCOUNT_URL:http://127.0.0.1:8085/internal/account}
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: demo_tx_group
  enable-auto-data-source-proxy: false
  config:
    type: file
  registry:
    type: file
  service:
    vgroup-mapping:
      demo_tx_group: default
    grouplist:
      default: ${SEATA_ADDRESS:127.0.0.1:8091}
  client:
    undo:
      log-serialization: jackson
logging:
  level:
    org.apache.seata: INFO
