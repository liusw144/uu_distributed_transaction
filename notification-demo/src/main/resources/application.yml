server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8086}
spring:
  application:
    name: notification-demo
demo:
  datasource:
    # 本机连接可直接使用；更换账号时修改本文件，环境变量覆盖为可选项。
    mysql:
      jdbc-url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3308/dtx_demo_mysql?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
      username: ${MYSQL_USER:root}
      password: ${MYSQL_PASSWORD:root}
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 5000
    postgresql:
      jdbc-url: ${PG_URL:jdbc:postgresql://127.0.0.1:5432/dtx_demo_pg}
      username: ${PG_USER:postgres}
      password: ${PG_PASSWORD:postgres}
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 5000
  queue:
    enabled: true
  callback-url: ${NOTIFY_CALLBACK_URL:http://127.0.0.1:8086/api/notify/callback}
  retry:
    max-attempts: ${RETRY_MAX_ATTEMPTS:8}
    base-seconds: ${RETRY_BASE_SECONDS:1}
    max-seconds: ${RETRY_MAX_SECONDS:60}
