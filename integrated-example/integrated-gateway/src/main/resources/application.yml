# 本机学习适配：基于 Spring Cloud Alibaba 2023.0.3.4 integrated-example。
# 本文件提供完整本机默认值，直接运行 main；环境变量覆盖是可选项。

server:
  # 仅监听本机，避免教学接口暴露到局域网。
  address: 127.0.0.1
  port: ${SERVER_PORT:18085}

spring:
  application:
    name: integrated-gateway
  main:
    web-application-type: reactive
  cloud:
    nacos:
      discovery:
        # 本机只监听回环地址，注册到 Nacos 的 IP 也必须一致。
        ip: ${SERVICE_IP:127.0.0.1}
        server-addr: ${NACOS_ADDRESS:127.0.0.1:8848}
        group: ${NACOS_GROUP:UU_INTEGRATED_EXAMPLE}
        metadata:
          module: integrated-example
      config:
        server-addr: ${NACOS_ADDRESS:127.0.0.1:8848}
        group: ${NACOS_GROUP:UU_INTEGRATED_EXAMPLE}
        file-extension: yaml
    gateway:
      # 保留业务路径前缀；内部 Feign 调用通过服务发现直达分支，不绕行网关。
      routes:
        - id: placeOrder
          uri: lb://integrated-order
          predicates:
            - Path=/order/**
        - id: queryStorage
          uri: lb://integrated-storage
          predicates:
            - Path=/storage/**
        - id: queryAccount
          uri: lb://integrated-account
          predicates:
            - Path=/account/**
        - id: praiseItemRocketMQ
          uri: lb://integrated-provider
          predicates:
            - Path=/praise/rocketmq
        - id: praiseItemSentinel
          uri: lb://integrated-provider
          predicates:
            - Path=/praise/sentinel
        - id: queryPraise
          uri: lb://integrated-consumer
          predicates:
            - Path=/praise/query
  config:
    # Data ID 沿用上游命名；缺少远程配置时仍使用本文件默认值。
    # 未在 import 中写死 group，解析时使用上面的 nacos.config.group。
    import:
      - optional:nacos:integrated-gateway.yaml

demo:
  sentinel:
    # GatewayConfig 对 praiseItemSentinel 路由加载的窗口限流规则。
    praise-count: 5
    praise-interval-seconds: 1

management:
  endpoints:
    web:
      # 仅开放健康和信息查询，不暴露网关路由写入等管理接口。
      exposure:
        include:
          - health
          - info
