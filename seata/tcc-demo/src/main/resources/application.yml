server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8103}
spring:
  application:
    name: seata-tcc-demo
  sql:
    init:
      mode: never
demo:
  datasource:
    mode: seata-tcc
    # 本机连接可直接使用；更换账号时修改本文件，环境变量覆盖为可选项。
    mysql:
      jdbc-url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3308/dtx_demo_mysql?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
      username: ${MYSQL_USER:root}
      password: ${MYSQL_PASSWORD:root}
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 5000
    postgresql:
      jdbc-url: ${PG_URL:jdbc:postgresql://127.0.0.1:5432/dtx_demo_pg}
      username: ${PG_USER:postgres}
      password: ${PG_PASSWORD:postgres}
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 5000
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: seata_tcc_group
  enable-auto-data-source-proxy: false
  registry:
    type: file
  config:
    type: file
  service:
    vgroup-mapping:
      seata_tcc_group: default
    grouplist:
      default: ${SEATA_ADDRESS:127.0.0.1:8091}
    disable-global-transaction: false
  client:
    rm:
      report-success-enable: true
logging:
  level:
    io.seata: INFO
