server.port=8103
server.address=127.0.0.1
spring.application.name=seata-tcc-demo
demo.datasource.mode=seata-tcc
spring.sql.init.mode=never
seata.enabled=true
seata.application-id=seata-tcc-demo
seata.tx-service-group=seata_tcc_group
